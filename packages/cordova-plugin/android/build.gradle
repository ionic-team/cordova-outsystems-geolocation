buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

dependencies {
    implementation("io.ionic.libs:iongeolocation-android:2.2.2")
    implementation("androidx.browser:browser:1.8.0")
    implementation("com.google.android.gms:play-services-auth:21.2.0")
    implementation("com.google.android.gms:play-services-location:21.3.0")

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // appcompact
    implementation "androidx.appcompat:appcompat:1.7.0"

    // constraint layout
    implementation "androidx.constraintlayout:constraintlayout:2.2.0-alpha13"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4")
    implementation 'com.google.code.gson:gson:2.10.1'
}


android {
    buildTypes {
        debug {
            // do not upload debug versions to crashlytics
        }
    }
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
}

// Cordova apps only get this file, so it writes its own R8 rules where clean won't remove them.
// Gson serializes IONGLOCLocationResult by field name.
def r8Rules = new File(rootDir, '.gradle/outsystems-geolocation-rules.pro')
r8Rules.parentFile.mkdirs()
r8Rules.text = '-keepclassmembers class io.ionic.libs.iongeolocationlib.model.IONGLOCLocationResult { <fields>; }\n'
android.buildTypes.release.proguardFile(r8Rules)
